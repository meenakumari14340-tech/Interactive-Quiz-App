<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgb(13,4,42);
    padding:20px;
}

/* SMALL CONTAINER */
.container{
    position:relative;
    width:100%;
    max-width:350px;
    background:rgb(13,4,42);
    padding:22px;
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 0 25px rgb(254,6,159);
}

/* HEADING */
.heading{
    text-align:center;
    font-size:38px;
    line-height:1.1;
    color:#f4f5f8;
    margin-bottom:25px;
}

/* LABEL */
label{
    display:block;
    font-size:15px;
    margin-bottom:7px;
    color:#f4f4f7;
    text-transform:capitalize;
}

/* SELECT */
select{
    width:100%;
    height:45px;
    padding:7px 10px;
    border-radius:8px;
    margin-bottom:14px;
    background:rgb(139,69,125);
    color:#111;
    font-size:15px;
    border:none;
    outline:none;
}

/* BUTTON */
.btn{
    width:100%;
    height:48px;
    background:rgb(224,6,140);
    border:none;
    border-radius:100px;
    color:azure;
    margin-top:15px;
    font-size:17px;
    font-weight:500;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#c05ea2;
}

.btn:disabled{
    cursor:pointer;
    background:rgb(254,6,159);
}

.hide{
    display:none;
}

/* TIMER */
.timer{
    width:100%;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:13px;
}

.timer .progress{
    position:relative;
    width:100%;
    height:25px;
    border-radius:40px;
    overflow:hidden;
    border:2px solid rgb(254,6,159);
}

.timer .progress .progress-bar{
    width:50%;
    height:100%;
    border-radius:30px;
    background:linear-gradient(to right,#ea517c,#b478f1);
    transition:1s linear;
}

.timer .progress .progress-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:14px;
}

/* QUESTION */
.question-wrapper{
    margin-bottom:13px;
}

.question-wrapper .number{
    color:#fff;
    font-size:16px;
    margin-bottom:8px;
}

.question-wrapper .number .total{
    font-size:14px;
}

.question-wrapper .question{
    color:#fff;
    font-size:19px;
    line-height:1.35;
    margin-bottom:13px;
}

/* ANSWERS */
.answer-wrapper{
    margin-bottom:3px;
}

.answer-wrapper .answer{
    width:100%;
    min-height:48px;
    padding:9px 11px;
    border-radius:8px;
    color:#fff;
    border:2px solid rgb(240,6,149);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
    cursor:pointer;
    transition:.3s;
    font-size:15px;
    line-height:1.2;
}

.answer .text{
    flex:1;
}

.answer .checkbox{
    flex:0 0 26px;
    width:26px;
    height:26px;
    font-size:13px;
    border-radius:50%;
    border:2px solid #eb0aa8;
    display:flex;
    align-items:center;
    justify-content:center;
}

.answer .checkbox .icon{
    opacity:0;
}

.answer:hover .checkbox,
.answer.selected .checkbox{
    background:#31192dfd;
    border-color:#bf1584;
}

.answer.selected .checkbox .icon{
    opacity:1;
}

.answer.correct{
    border-color:rgb(14,228,14);
}

.answer.wrong{
    border-color:rgb(244,5,5);
}

.btn.next{
    display:none;
}

/* END SCREEN */
.end-screen .score{
    color:#fff;
    font-size:32px;
    font-weight:500;
    margin-bottom:30px;
    text-align:center;
}

.end-screen .score-text{
    color:#f7f8fc;
    font-size:27px;
    margin-bottom:12px;
}

/* MOBILE */
@media(max-width:480px){
    body{
        padding:0;
    }

    .container{
        max-width:100%;
        min-height:100vh;
        border-radius:0;
        padding:22px 18px;
    }

    .heading{
        font-size:35px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- START SCREEN -->
    <div class="start-screen">

        <h1 class="heading">QUIZ APP</h1>

        <div class="settings">

            <label for="num-questions">
                Number of Questions
            </label>

            <select id="num-questions" name="num-questions">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="25">25</option>
                <option value="50">50</option>
            </select>

            <label for="category">
                Select Category
            </label>

            <select id="category" name="category">
                <option value="">Any Category</option>
                <option value="9">General Knowledge</option>
                <option value="18">Science: Computers</option>
                <option value="21">Sports</option>
                <option value="23">History</option>
            </select>

            <label for="difficulty">
                Select Difficulty
            </label>

            <select id="difficulty" name="difficulty">
                <option value="">Any Difficulty</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

            <label for="time">
                Select Time
            </label>

            <select id="time" name="time">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
                <option value="60">60</option>
            </select>

        </div>

        <button class="btn start">
            Start Quiz
        </button>

    </div>


    <!-- QUIZ SCREEN -->
    <div class="quiz hide">

        <div class="timer">
            <div class="progress">
                <div class="progress-bar"></div>
                <span class="progress-text">50</span>
            </div>
        </div>

        <div class="question-wrapper">

            <div class="number">
                Question
                <span class="current">1</span>
                <span class="total">/10</span>
            </div>

            <div class="question">
                This is a Question
            </div>

        </div>

        <div class="answer-wrapper">

            <div class="answer selected">
                <span class="text">Answer</span>

                <span class="checkbox">
                    <span class="icon">✔</span>
                </span>
            </div>

            <div class="answer correct">
                <span class="text">Answer</span>

                <span class="checkbox">
                    <span class="icon">✔</span>
                </span>
            </div>

            <div class="answer wrong">
                <span class="text">Answer</span>

                <span class="checkbox">
                    <span class="icon">✔</span>
                </span>
            </div>

        </div>

        <button class="btn submit" disabled>
            Submit
        </button>

        <button class="btn next">
            Next
        </button>

    </div>


    <!-- END SCREEN -->
    <div class="end-screen hide">

        <h1 class="heading">
            QUIZ APP
        </h1>

        <div class="score">

            <div class="score-text">
                Your Score:
            </div>

            <div>
                <span class="final-score">0</span>
                <span class="total-score">/10</span>
            </div>

        </div>

        <button class="btn restart">
            Restart Quiz
        </button>

    </div>

</div>


<script>

const progressBar =
    document.querySelector(".progress-bar");

const progressText =
    document.querySelector(".progress-text");

const progress = (value) => {

    const percentage =
        (value / time) * 100;

    progressBar.style.width =
        `${percentage}%`;

    progressText.innerHTML =
        `${value}`;
};


let questions = [];

let time = 60;

let score = 0;

let currentQuestion;

let timer;


const startBtn =
    document.querySelector(".start");

const numQuestions =
    document.querySelector("#num-questions");

const category =
    document.querySelector("#category");

const difficulty =
    document.querySelector("#difficulty");

const timePerQuestion =
    document.querySelector("#time");

const quiz =
    document.querySelector(".quiz");

const startscreen =
    document.querySelector(".start-screen");


const startQuiz = () => {

    const num =
        numQuestions.value;

    const cat =
        category.value;

    const diff =
        difficulty.value;

    const url =
        `https://opentdb.com/api.php?amount=${num}&category=${cat}&difficulty=${diff}&type=multiple`;

    fetch(url)

        .then((res) => res.json())

        .then((data) => {

            questions =
                data.results;

            startscreen.classList.add("hide");

            quiz.classList.remove("hide");

            currentQuestion = 1;

            showQuestion(questions[0]);

        });
};


startBtn.addEventListener(
    "click",
    startQuiz
);


const submitBtn =
    document.querySelector(".submit");

const nextBtn =
    document.querySelector(".next");


const showQuestion = (question) => {

    const questionText =
        document.querySelector(".question");

    const answersWrapper =
        document.querySelector(".answer-wrapper");

    const questionNumber =
        document.querySelector(".number");


    questionText.innerHTML =
        question.question;


    const answers = [
        ...question.incorrect_answers,
        question.correct_answer.toString()
    ];


    answers.sort(
        () => Math.random() - 0.5
    );


    answersWrapper.innerHTML = "";


    answers.forEach((answer) => {

        answersWrapper.innerHTML += `

            <div class="answer">

                <span class="text">
                    ${answer}
                </span>

                <span class="checkbox">

                    <span class="icon">
                        ✔
                    </span>

                </span>

            </div>

        `;

    });


    questionNumber.innerHTML = `

        Question

        <span class="current">
            ${questions.indexOf(question) + 1}
        </span>

        <span class="total">
            /${questions.length}
        </span>

    `;


    const answerDivs =
        document.querySelectorAll(".answer");


    answerDivs.forEach((answer) => {

        answer.addEventListener(
            "click",
            () => {

                if(
                    !answer.classList.contains("checked")
                ){

                    answerDivs.forEach((a) =>
                        a.classList.remove("selected")
                    );

                    answer.classList.add("selected");

                    submitBtn.disabled = false;
                }

            }
        );

    });


    time =
        parseInt(timePerQuestion.value);

    startTimer(time);
};


const startTimer = (t) => {

    let currentTime = t;

    timer = setInterval(() => {

        if(currentTime > 0){

            progress(currentTime);

            currentTime--;

        }
        else{

            clearInterval(timer);

            checkAnswer();

        }

    },1000);

};


submitBtn.addEventListener(
    "click",
    () => {
        checkAnswer();
    }
);


const checkAnswer = () => {

    clearInterval(timer);


    const selectedAnswer =
        document.querySelector(".answer.selected");

    const correct =
        questions[currentQuestion - 1].correct_answer;


    if(selectedAnswer){

        const answerText =
            selectedAnswer.querySelector(".text").innerHTML;


        if(answerText === correct){

            score++;

            selectedAnswer.classList.add("correct");

        }
        else{

            selectedAnswer.classList.add("wrong");

            document
                .querySelectorAll(".answer")
                .forEach((answer) => {

                    if(
                        answer.querySelector(".text").innerHTML ===
                        questions[currentQuestion - 1].correct_answer
                    ){

                        answer.classList.add("correct");

                    }

                });

        }

    }
    else{

        document
            .querySelectorAll(".answer")
            .forEach((answer) => {

                if(
                    answer.querySelector(".text").innerHTML === correct
                ){

                    answer.classList.add("correct");

                }

            });

    }


    document
        .querySelectorAll(".answer")
        .forEach((answer) => {

            answer.classList.add("checked");

        });


    submitBtn.style.display =
        "none";

    nextBtn.style.display =
        "block";
};


nextBtn.addEventListener(
    "click",
    () => {
        nextQuestion();
    }
);


const nextQuestion = () => {

    if(currentQuestion < questions.length){

        currentQuestion++;

        showQuestion(
            questions[currentQuestion - 1]
        );

        submitBtn.style.display =
            "block";

        nextBtn.style.display =
            "none";

        submitBtn.disabled =
            true;

    }
    else{

        showScore();

    }

};


const endScreen =
    document.querySelector(".end-screen");

const finalScore =
    document.querySelector(".final-score");

const totalScore =
    document.querySelector(".total-score");


const showScore = () => {

    endScreen.classList.remove("hide");

    quiz.classList.add("hide");

    finalScore.innerHTML =
        score;

    totalScore.innerHTML =
        `/${questions.length}`;

};


const restartBtn =
    document.querySelector(".restart");


restartBtn.addEventListener(
    "click",
    () => {
        window.location.reload();
    }
);

</script>

</body>
</html>
```
